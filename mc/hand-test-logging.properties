# Dev-only java.util.logging config for the two hand-test client run configs
# (mc.gradle.kts: runClientA / runClientB). Not shipped in any jar.
#
# Why this file exists: DESIGN.md §7 already records one P4 bug that hid for a
# whole hand-test session behind a Level.FINE log nobody could see, and a
# second round then lost time to exactly the same blindness -- ClientCueCapture
# .logTransition ("activity=... screen=... intensity=...") is the one line that
# says what a client actually decided to send, and it is FINE. The default JUL
# level is INFO, so in a stock run it is invisible.
#
# This turns FINE on for the mod's own logger only, so the hand-test log stays
# readable: Minecraft's own logging goes through log4j and is untouched.
handlers = java.util.logging.ConsoleHandler
.level = INFO

socialcues.level = FINE
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = [socialcues] %5$s%6$s%n
