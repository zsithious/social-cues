name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The Paper plugin is one jar for every supported version, so it is the one
  # artifact that can need a re-publish without a new tag behind it -- a failed
  # upload, or a page created after the tag went out. Re-tagging to fix that
  # would try to re-publish twelve Fabric versions that are already up, which
  # Modrinth rejects. This runs the one job instead.
  workflow_dispatch:
    inputs:
      publish-paper:
        description: 'Publish the Paper plugin to Modrinth from this ref'
        type: boolean
        default: false

# NOTE: the build refuses to run on anything but JDK 21 (see the check in
# build.gradle.kts -- Loom 1.17.17 has only been verified there). setup-java
# installs 21 below, and every gradle invocation passes it explicitly via
# -Dorg.gradle.java.home so the daemon cannot pick up some other JDK that
# happens to be on the runner image.

jobs:
  # versions.json is the single source of truth for the version matrix
  # (DESIGN.md §3): settings.gradle.kts generates the twelve :mc:<version>
  # projects from it, so a hardcoded list here would be a second copy free to
  # drift the moment a row is added. This job turns that file into the matrix
  # every downstream job fans out over.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      mc-versions: ${{ steps.read.outputs.mc-versions }}
      mc-version-lines: ${{ steps.read.outputs.mc-version-lines }}
      publish-targets: ${{ steps.read.outputs.publish-targets }}
      mod-version: ${{ steps.read.outputs.mod-version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "mc-versions=$(jq -c '[.versions[].mc]' versions.json)" >> "$GITHUB_OUTPUT"
          # Each row carries its own Modrinth release channel, derived from
          # versions.json's handTested flag rather than hardcoded here: the
          # flag records a *fact* (has anyone actually run this row in game),
          # and this line is the one place the policy "tested -> release,
          # otherwise beta" lives. Flipping a row after a hand test is a
          # one-word edit in versions.json.
          echo "publish-targets=$(jq -c '[.versions[] | {mc: .mc, channel: (if .handTested then "release" else "beta" end)}]' versions.json)" >> "$GITHUB_OUTPUT"
          echo "mod-version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          # The same list again, one version per line, for the Paper job -- the
          # single jar there is published as one Modrinth version listing all
          # twelve. mc-publish splits its list inputs on newlines: a comma- or
          # space-joined list arrives as one game version named
          # "1.21, 1.21.1, ..." which no registry has heard of, gets dropped as
          # unknown, and the upload then fails with "at least one game version
          # should be specified" -- a message that reads as though the input
          # never arrived at all. Both wrong separators were tried on the 1.0.0
          # tag before this line existed.
          {
            echo 'mc-version-lines<<MCEOF'
            jq -r '.versions[].mc' versions.json
            echo 'MCEOF'
          } >> "$GITHUB_OUTPUT"

  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: core unit tests (JUnit 5)
        run: ./gradlew :core:test -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

  fabric-matrix:
    needs: [matrix, core-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.matrix.outputs.mc-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: build :mc:${{ matrix.mc }}
        run: ./gradlew ":mc:${{ matrix.mc }}:build" -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.mc }}
          path: mc/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error

  paper-build:
    needs: core-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: build Paper plugin
        run: ./gradlew :paper:build -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/build/libs/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publishing (DESIGN.md §13). Runs only on a v* tag, and only once the
  # repository actually has somewhere to publish to: each job is gated on its
  # own MODRINTH_ID* repository *variable*, so until one is set that job skips
  # cleanly instead of failing every tag with a credentials error.
  #
  # TWO Modrinth projects, not one. Modrinth would accept a single project
  # carrying both loader families (Chunky does exactly that), so this is a
  # product decision rather than a platform limit: the mod and the plugin are
  # installed by different people, in different places, from different
  # instructions, and a shared version list would interleave twelve client
  # jars with one server jar under a single "Versions" tab. Two pages, two
  # ids -- but still one tag, so their versions can never drift apart.
  #
  # Setup, once:
  #   - repository variable MODRINTH_ID       = the Modrinth *mod* project id
  #   - repository variable MODRINTH_ID_PAPER = the Modrinth *plugin* project id
  #   - repository secret   MODRINTH_TOKEN    = a Modrinth PAT with write access
  # ---------------------------------------------------------------------------

  # GitHub is where the tag itself lives, so the thirteen jars belong on it too.
  # A Modrinth outage, a page still in review, or simply someone who does not use
  # Modrinth should not stand between a tag and the files it names. Unlike the two
  # jobs below this one is not gated on a repository variable: the release goes to
  # this repository, which by definition exists.
  github-release:
    needs: [matrix, fabric-matrix, paper-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The repository's default GITHUB_TOKEN is read-only. Creating a release needs
    # contents:write, asked for here rather than workflow-wide so the build jobs
    # keep the read-only token they are perfectly happy with.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Same rule as the Modrinth jobs: the release notes are this version's
      # changelog section, not the whole file.
      - name: extract this version's changelog section
        run: |
          awk '/^## \[/{ if (seen++) exit } seen' CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Twelve Fabric rows plus the one Paper jar. Asserted rather than
          # assumed: a matrix row that silently produced nothing would otherwise
          # ship as a release that is quietly missing a Minecraft version.
          test "$(ls dist/*.jar | wc -l)" -eq 13
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "Social Cues ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE-NOTES.md

  # One Modrinth version PER Minecraft version, not one version carrying all
  # twelve jars. Modrinth would accept the latter, but then every player sees
  # twelve files under a single entry with nothing saying which one is theirs;
  # a version per row is what makes the site's own "1.21.4" filter return the
  # 1.21.4 jar.
  publish-fabric:
    needs: [matrix, fabric-matrix, paper-build]
    if: startsWith(github.ref, 'refs/tags/v') && vars.MODRINTH_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised: twelve parallel uploads to the same project is a good way
      # to meet Modrinth's rate limiter on a release.
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.publish-targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fabric-${{ matrix.target.mc }}
          path: dist
      # mc-publish drops the file it is handed straight into the version's notes
      # verbatim. Pointing it at CHANGELOG.md would therefore paste the project's
      # entire history under every version -- harmless today with one entry, wrong
      # the moment there are two. Hand it only the top section.
      - name: extract this version's changelog section
        run: |
          awk '/^## \[/{ if (seen++) exit } seen' CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md
      - name: publish ${{ matrix.target.mc }} to Modrinth (${{ matrix.target.channel }})
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/!(*-@(dev|sources)).jar
          name: Social Cues ${{ needs.matrix.outputs.mod-version }} for ${{ matrix.target.mc }}
          version: ${{ needs.matrix.outputs.mod-version }}+mc${{ matrix.target.mc }}
          game-versions: ${{ matrix.target.mc }}
          loaders: fabric
          # release only for rows someone has actually played; see the matrix
          # job for where this comes from.
          version-type: ${{ matrix.target.channel }}
          # Deliberately not inferred from the jar: fabric.mod.json declares a
          # `~1.21.x` range for the loader's benefit, which is not the same
          # question as "which Modrinth game version is this file for".
          game-version-filter: none
          # The plugin is listed as optional rather than required because the
          # server half is only a plugin when the server is Paper-based; on a
          # Fabric server it is this same jar. Listing it puts a link to the
          # other page in Modrinth's own dependency box, which is where someone
          # installing the mod will look for it.
          dependencies: |
            fabric-api(required)
            ${{ vars.MODRINTH_ID_PAPER }}(optional)
            modmenu(optional)
            simple-voice-chat(optional)
          changelog-file: RELEASE-NOTES.md

  # The Paper plugin is one jar for all of 1.21.x (DESIGN.md §8: no NMS, built
  # against the oldest supported API), so it is one Modrinth version listing
  # every game version it actually supports.
  publish-paper:
    needs: [matrix, fabric-matrix, paper-build]
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish-paper) && vars.MODRINTH_ID_PAPER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paper
          path: dist
      # mc-publish drops the file it is handed straight into the version's notes
      # verbatim. Pointing it at CHANGELOG.md would therefore paste the project's
      # entire history under every version -- harmless today with one entry, wrong
      # the moment there are two. Hand it only the top section.
      - name: extract this version's changelog section
        run: |
          awk '/^## \[/{ if (seen++) exit } seen' CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md
      - name: publish Paper plugin to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID_PAPER }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/!(*-@(dev|sources)).jar
          name: Social Cues ${{ needs.matrix.outputs.mod-version }} (Paper plugin)
          version: ${{ needs.matrix.outputs.mod-version }}+paper
          # The one plugin jar was start-up verified on both a 1.21 and a
          # 1.21.11 server, and it is the same jar everywhere by construction
          # (no NMS, oldest-API compile), so this one is a release.
          version-type: release
          # Every row the Fabric side supports, because the single jar does.
          # Newline-separated; see the matrix job for why that matters.
          game-versions: ${{ needs.matrix.outputs.mc-version-lines }}
          game-version-filter: none
          # Folia is deliberately absent: the plugin schedules through
          # BukkitPluginScheduler, and Folia needs region schedulers. Claiming
          # it would be claiming something nobody has run.
          loaders: |
            bukkit
            spigot
            paper
            purpur
          # The client mod, so the two pages point at each other from inside
          # Modrinth as well as from their descriptions. Optional in the literal
          # sense the field means: the plugin installs and runs without it, it
          # just has nobody to relay for.
          dependencies: |
            ${{ vars.MODRINTH_ID }}(optional)
            placeholderapi(optional)
          changelog-file: RELEASE-NOTES.md
