org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# NOTE: org.gradle.java.home is deliberately NOT set here. It used to pin an
# absolute path to one developer's JDK, which meant nobody else could build this
# repo at all -- Gradle rejects an invalid java.home outright. The requirement it
# encoded is real (see the check in build.gradle.kts), but it belongs in your own
# ~/.gradle/gradle.properties or in JAVA_HOME, not in a shared file.
# :core:test must not pay for evaluating (and Loom-provisioning) all 12
# :mc:<version> projects. Configuration-on-demand defers a project's own
# build script until something in the requested task graph actually needs
# it (verified: see DESIGN deviation notes in the P0 report).
org.gradle.configureondemand=true

maven_group=dev.zsithious.socialcues
mod_version=1.0.0

loader_version=0.19.3
loom_version=1.17.17

# DESIGN.md §13 (P8) — project URLs, used for fabric.mod.json's `contact`
# block, plugin.yml's `website`, and the Modrinth store page.
#
# All three point at the repository rather than at the Modrinth pages: a
# Modrinth project is not reachable until a version has been uploaded and the
# page has passed review, and shipping a link that 404s to every mod list and
# mirror is exactly what the "no dead links" rule above is about. The store
# pages link back here instead.
project_homepage=https://github.com/zsithious/social-cues
project_sources=https://github.com/zsithious/social-cues
project_issues=https://github.com/zsithious/social-cues/issues
