# Social Cues — Paper eklentisi yapılandırması.
# Bkz. DESIGN.md §5 (protokol/politika bitleri), §8.7 (bu dosyanın alanları), §9.
#
# Sunucu politikası her zaman üst sınırdır: istemci burada açık olan bir
# özelliği kapatabilir (kendi SharePrefs'i ile), ama burada kapalı olan bir
# özelliği açamaz. Röle, etkin izne uymayan alanları gönderim anında sıfırlar.

policy:
  # DESIGN.md §5 politika bitleri — sunucunun izin verdiği özellikler.
  share-typing: true          # bit 0 TYPING — yazma durumu
  share-screens: true         # bit 1 SCREENS — bir ekranda olma durumu
  share-screen-detail: true   # bit 2 SCREEN_DETAIL — ekran türü ayrıntısı (kapalıysa UNKNOWN)
  share-voice: true           # bit 4 VOICE — konuşma durumu
  share-intensity: true       # bit 5 INTENSITY — yazma hızı (kapalıysa 0 gönderilir)
  share-global-tier: true     # bit 6 GLOBAL_TIER — sekme listesi için kaba global yayın

# off | nearby | all — DESIGN.md §5'teki bit çevrimi:
#   off    -> bit 3 (IDLE) kapalı, bit 7 (GLOBAL_AFK) kapalı
#   nearby -> bit 3 açık, bit 7 kapalı  (varsayılan — anti-raid: AFK listesi herkese açık değil)
#   all    -> bit 3 ve bit 7 açık
afk-visibility: nearby

# DESIGN.md §5: yakın katman yarıçapı (blok) ve toplu yayın periyodu (tick, 20/sn).
near-radius: 48.0
update-interval-ticks: 4

# DESIGN.md §4/§6: bu eşiğin 2 katı SLEEPY bayrağını tetikler (istemci tarafında).
idle-threshold-seconds: 300

rate-limit:
  # DESIGN.md §5: "oyuncu başına ≤4 CueUpdate/saniye; aşan paketler düşer."
  max-updates-per-second: 4
  # Ardışık ihlal (hız sınırı aşımı / aşırı boyut / bozuk paket) sayısı bu eşiği
  # geçerse oyuncu atılır. 0 = asla atma, sadece paketi düşür + logla.
  #
  # Varsayılan 0 (kapalı): gerçek bir sunucuda bir lag spike'ı, ViaVersion'ın
  # eski bir istemciyi yeniden paketlemesindeki bir tuhaflık ya da bozuk/başka
  # bir modun ürettiği kötü niyetsiz bir istemci paketleri kolayca "ardışık
  # ihlal" eşiğine değdirebilir; bu, hız sınırını aşan ama saldırgan olmayan
  # masum bir oyuncuyu sunucudan atmak demektir. Kick, bilinçli bir opt-in
  # olmalı, sürpriz bir varsayılan değil.
  kick-after-violations: 0

# DESIGN.md §5: global (sekme listesi) katman "değişimde ve ≤1/saniye".
global-broadcast-min-interval-ms: 1000
