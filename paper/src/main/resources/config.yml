# Social Cues — Paper plugin configuration.
#
# The server policy is always the ceiling. A player's own client settings can
# turn OFF anything enabled here, but can never turn ON anything disabled here.
# The relay clears any field the effective permission does not allow at the
# moment it is sent, so a disabled cue is never transmitted at all — it is not
# merely hidden on the receiving side.
#
# Reload with a server restart. Every option below takes effect for cues sent
# after the change; nothing is stored or replayed.

policy:
  # What the server permits players to share about themselves.
  share-typing: true          # typing in chat, a command, a sign, or a book
  share-screens: true         # that a menu is open at all
  share-screen-detail: true   # WHICH menu is open; when false, clients see only "a menu"
  share-voice: true           # speaking, when Simple Voice Chat is installed
  share-intensity: true       # typing speed, which drives how fast the arms move
  share-global-tier: true     # the coarse, distance-independent cue used by the tab list

# Who may see that a player is idle.
#   off     nobody
#   nearby  only players within near-radius below   (default)
#   all     everyone, including through the tab list
#
# "nearby" is the default on purpose: a server-wide list of who is AFK is a
# raiding aid, since it says which bases are unattended and for how long.
afk-visibility: nearby

# Radius in blocks for the detailed, near-range cue layer. Players further away
# than this fall back to the coarse tab-list cue (if share-global-tier allows).
near-radius: 48.0

# How often batched cues are broadcast, in ticks (20 ticks = 1 second).
# Lower is more responsive and more bandwidth; 4 is roughly 5 updates a second.
update-interval-ticks: 4

# Seconds of no input before a player counts as idle. Twice this value marks
# them as asleep, which clients draw differently.
idle-threshold-seconds: 300

rate-limit:
  # Cue updates accepted per player per second. Anything above this is dropped.
  max-updates-per-second: 4

  # Kick a player after this many consecutive violations (rate limit exceeded,
  # oversized packet, or malformed packet). 0 disables kicking: offending
  # packets are still dropped and logged, the player just stays connected.
  #
  # 0 is the default deliberately. On a real server a lag spike, a quirk in how
  # ViaVersion repacks an older client, or some unrelated mod producing odd
  # packets can all run up a violation streak without anyone acting in bad
  # faith — and kicking there means throwing out an innocent player. Kicking
  # should be a decision an admin makes, not a surprise default.
  kick-after-violations: 0

# Minimum gap in milliseconds between coarse tab-list broadcasts for a player.
# The coarse layer is sent on change and no more often than this.
global-broadcast-min-interval-ms: 1000
