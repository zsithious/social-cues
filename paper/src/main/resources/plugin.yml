name: SocialCues
version: ${version}
main: dev.zsithious.socialcues.paper.SocialCuesPlugin
api-version: '1.21'
author: zsithious
${website_line}# DESIGN.md §14 P8: optional. Present -> the %socialcues_*% placeholders are
# registered; absent -> the plugin runs exactly as before and never loads the
# expansion class at all.
softdepend: [PlaceholderAPI]
description: See when players are typing, browsing a GUI, or idle. Open source, independent alternative implementation.
permissions:
  socialcues.share:
    description: Allows sharing your own activity cues with other players.
    default: true
  socialcues.see:
    description: Allows seeing other players' activity cues.
    default: true
